function nav(active){return `<nav class="bottom-nav" aria-label="主导航">${B(icon('clinic')+'<span>诊间</span>','root','clinic',active==='clinic'?'active':'')}${B(`<span class="ai-nav">${S.avatar==='herb'?'🌱':S.avatar==='apricot'?'🍑':'🌼'}</span><span>${esc(S.name)}</span>`,'root','home',active==='home'?'active':'')}${B(icon('book')+'<span>成长</span>','root','growth',active==='growth'?'active':'')}</nav>`;}
function page(title,sub,body,options={}){return `<section class="page">${head(title,sub,options.tools||'',options.back!==false)}<div class="page-scroll">${body}</div>${options.footer?`<div class="sticky-action">${options.footer}</div>`:''}${options.nav?nav(options.nav):''}</section>`;}
function patientRow(p,act='journey',sub=''){return B(`<span class="initial ${p.gender==='男'?'alt':''}">${esc(p.name.slice(-1))}</span><span class="grow"><h3>${esc(p.name)} <small>${p.gender} · ${p.age}岁</small></h3><p>${esc(sub||p.visits[0].disease+' · '+p.visits.length+'次诊疗')}</p></span><span class="arrow">›</span>`,act,p.id,'list-row');}
function card(title,body,small=''){return `<section class="card"><div class="card-title"><h2>${title}</h2>${small}</div>${body}</section>`;}
function kv(k,v){return `<div class="kv"><label>${esc(k)}</label><div>${esc(v)}</div></div>`;}

if(i===4){body=card('只改一个条件',`<p>“改成明天上午10点联系。”</p><p class="muted">当前：${esc(S.contactTime)}</p>${S.contactTime==='明天10:00'?'<div class="changed">今天18:00 → 明天10:00<br>患者名单与其他规则不变</div>':''}`);label=S.contactTime==='明天10:00'?'查看更新后的计划':'模拟说：改成明天上午10点';action='practiceAdjust';}
if(i===5){body=card('请确认最新计划',planSummary())+`<div class="note">已核对 ${S.verified.length}/${S.practiceIds.length} 位患者。修改计划后，需要确认当前版本。</div>`;label='确认第'+S.planVersion+'版计划并模拟执行';action='practiceExecute';}

if(i===8){body=card('医生回复草稿',`<textarea id="practiceReply" data-draft="practiceReply">${esc(S.replyDraft)}</textarea><small>可语音表达或直接编辑。此时尚未发送。</small>`);label='预览完整回复';action='practiceDraft';}

if(i===14){body=`<div class="hero"><span class="eyebrow">第一次合作，完成了</span><h2>以后，直接告诉我</h2><p>布置任务、讨论中医、聊聊日常。<br>需要您确认的，我会先问您。</p></div><div class="grid2">${B('告诉AI第一个任务','taskVoicePrompt','','btn primary')}${B('继续聊天','finishPractice','','btn')}</div>`;label='完成练习，继续完整演示';action='finishPractice';}

function messageHTML(m){return `<div class="message ${m.role==='user'?'user':''}"><small>${m.role==='user'?esc(S.doctor):esc(S.name)}</small><div class="bubble">${esc(m.text)}</div>${m.card?B(`<small>${esc(m.card.label||'点击查看')}</small><h3>${esc(m.card.title)}</h3><span class="link">打开详情 →</span>`,m.card.act,m.card.val,'answer-card'):''}</div>`;}
function homeView(){ensureGreeting();return `<section class="page">${head(S.name,'今天也一起，把工作变轻一点',B(icon('logs'),'go','logs','icon-btn')+B(icon('tasks'),'go','tasks','icon-btn')+B(icon('settings'),'go','settings','icon-btn'),false)}${creature()}<div class="chat-scroll" id="chat">${S.messages.map(messageHTML).join('')}</div><div class="chat-hints">${B('说一句话布置任务','taskVoicePrompt','','chip')}${B('复盘一个病案','go','growth','chip')}${B('聊一个中医问题','askCase','','chip')}</div><div class="composer">${B(icon('volume'),'voice','','icon-btn')}<input id="chatInput" placeholder="直接说想法，或在这里输入" aria-label="给AI发消息">${B(icon('send'),'chatSend','','icon-btn')}${B(icon('history'),'go','history','icon-btn')}</div>${nav('home')}</section>`;}
function ai(text,cardInfo){S.messages.push({role:'ai',text,card:cardInfo,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});persist();speak(text);}
function user(text){S.messages.push({role:'user',text,time:'现在'});persist();}
function chatSend(text){if(!text.trim())return;user(text);if(/打开.*任务|任务中心/.test(text)){ai('任务中心已准备好，您可以查看患者管理、病案复盘等所有任务。',{title:'任务中心',act:'go',val:'tasks'});}else if(/复盘|分析病案/.test(text)){const p=PATIENTS.find(p=>text.includes(p.name));ai(p?`准备复盘${p.name}的病案，请先确认病程范围和重点。`:'想复盘哪位患者？可以先从个人知识库选一份病案。',{title:p?p.name+' · 复盘计划':'选择患者病案',act:p?'reviewPlan':'go',val:p?p.id:'growth'});}else if(/联系|随访|患者管理|布置.*任务/.test(text)){ai('我会先准备患者名单、联系时间和问询规则，您确认后再模拟执行。',{title:'确认患者管理计划',act:'newTask',val:text});}else if(/筛选|找一下|鼻塞|个人知识库/.test(text)){applyNatural(text);ai('已把您的要求整理为可修改的筛选条件，结果会显示命中的症状记录。',{title:'查看个人知识库',act:'go',val:'growth'});}else if(/病历|录音|诊间/.test(text)){ai('可以开始记录诊间对话。生成的病历需要您核实后才会回写。',{title:'诊间辅助',act:'go',val:'clinic'});}else if(/咳嗽|辨证|中医|秋燥/.test(text)){ai(KNOWLEDGE_ANSWER,{title:'查看完整临床讨论',act:'go',val:'knowledgeAnswer'});}else if(/继续新手|新手指引/.test(text)){ai('可以从上次的步骤继续，也可以重新开始。',{title:'继续新手练习',act:'resumePractice'});}else if(/累|忙|辛苦/.test(text)){ai('嗯，今天辛苦了。您想说说门诊的事，还是聊点轻松的？我都在，不会把闲聊自动变成任务。');}else if(/英文|english/i.test(text)){ai('Of course. We can talk in English. For patient care, I will show you the plan and ask for your confirmation before any action.');}else if(/hello|hi\b|tired|help/i.test(text)){ai('I am here with you. Would you like to talk for a moment, review a case, or prepare a patient follow-up plan? This demo uses simulated responses.');}else{ai('我听到了。您想继续聊这个话题，还是希望我帮您整理成一个具体的工作计划？原型使用预设交互，不连接真实模型。');}render();setTimeout(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;},30);}
function getTasks(){const base=S.tasks.slice();if(S.practiceExecuted)base.unshift({id:'practice',type:'care',title:'失眠关怀 · 新手练习',status:'正在进行',ids:S.practiceIds,attention:S.practiceIds.includes('p1')?['p1']:[],replied:S.practiceIds,booked:[],unlinked:[],time:S.contactTime,rules:'虚拟患者，演示反馈；不触达真实患者。',practice:true});return base.concat(S.reviews.map(r=>({id:r.id,type:'review',title:person(r.patientId).name+' · '+r.disease+'复盘',status:r.status==='已完成'?'已完成':r.status==='已取消'?'已取消':'正在进行',ids:[r.patientId],review:r})));}

function taskProgress(t){
 const status=t.status,kind=status==='已暂停'?'paused':status==='已取消'?'cancelled':status==='已完成'?'done':'active';
 if(t.type==='review'){
  const stage=status==='已完成'?3:2;
  return {value:Math.round(stage/3*100),kind,label:'复盘进度',detail:stage+' / 3 阶段',hint:status==='已取消'?'已取消 · 保留停止时的分析阶段':stage===3?'报告已生成，可进入查看结果':'已整理病历与时间线 · 正在分析复盘'};
 }
 const ids=[...new Set(t.ids||[])],n=ids.length,done=ids.filter(id=>(t.replied||[]).includes(id)).length;
 const missing=ids.filter(id=>(t.unlinked||[]).includes(id)).length;
 const attention=ids.filter(id=>(t.attention||[]).includes(id)&&!S.handled.includes(id)).length;
 const hint=status==='已暂停'?'已暂停 · 恢复后继续跟进':status==='已取消'?'已取消 · 不再继续跟进':status==='已完成'?'任务已结束 · 回复不等于问题已解决':attention?attention+'位患者待医生确认':done?'已收集反馈，持续跟进患者情况':'等待患者反馈';
 return {value:n?Math.round(done/n*100):0,kind,label:'反馈收集进度',detail:done+' / '+n+' 位已回复',hint:hint+(missing?' · '+missing+'位未建联':'')};
}
function taskProgressHTML(t){const p=taskProgress(t);return '<span class="task-progress '+p.kind+'"><span class="task-progress-caption"><span>'+esc(p.label)+'</span><strong>'+p.value+'%</strong></span><span class="task-progress-track" role="progressbar" aria-label="'+esc(t.title+' · '+p.label)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p.value+'" aria-valuetext="'+esc(p.detail+'；'+p.hint)+'"><span style="width:'+p.value+'%"></span></span><span class="task-progress-detail">'+esc(p.detail)+'</span><span class="task-progress-note">'+esc(p.hint)+'</span></span>';}
function taskCardHTML(t){return B('<span class="task-card-heading"><span class="initial '+(t.type==='review'?'alt':'')+'">'+(t.type==='review'?'复':'护')+'</span><span class="grow"><span class="task-card-title">'+esc(t.title)+'</span><span class="task-card-meta">'+t.ids.length+'位患者 · '+(t.type==='review'?'病案分析':'患者管理')+(t.practice?' · 练习':'')+'</span></span>'+badge(t.status,t.status==='已暂停'?'warn':t.status==='已取消'?'gray':'')+'</span>'+taskProgressHTML(t)+'<span class="task-card-open">查看任务详情 <span aria-hidden="true">›</span></span>','task',t.id,'task-card');}

function tasksView(){const ts=getTasks(),real=ts.filter(t=>!t.practice),shown=ts.filter(t=>S.taskFilter==='全部'||t.status===S.taskFilter);const metrics=['正在进行','已完成','已暂停','全部'].map(k=>B('<b>'+(k==='全部'?real.length:real.filter(t=>t.status===k).length)+'</b><span>'+(k==='全部'?'发布总数':k)+'</span>','taskFilter',k,'')).join('');const tabs=['正在进行','已暂停','已完成','已取消','全部'].map(k=>B(k,'taskFilter',k,'chip '+(S.taskFilter===k?'active':''))).join('');return page('任务中心','交代给我的事，都在这里','<div class="hero"><span class="eyebrow">持续推进，有迹可循</span><div class="metrics four">'+metrics+'</div><small>不含新手练习；总数包含已取消任务。</small></div><div class="chips hscroll">'+tabs+'</div><div class="task-card-list">'+(shown.length?shown.map(taskCardHTML).join(''):'<div class="card empty">这个状态下暂无任务<br><small>想安排新的工作，直接对AI说一句话。</small></div>')+'</div>');}
function taskView(id){const t=getTasks().find(t=>t.id===id);if(!t)return page('任务不存在','',B('返回任务中心','go','tasks','btn full'));if(t.type==='review')return reviewTaskView(t.review.id);const replied=t.replied||[],attention=t.attention||[],booked=t.booked||[];return page(t.practice?'练习任务详情':'患者管理任务',t.title,`<div class="hero"><div class="between"><span class="eyebrow">任务结果</span>${badge(t.status)}</div><div class="metrics four">${[[t.ids.length,'涉及患者','all'],[replied.length,'已回复','replied'],[attention.length,'需关注','attention'],[booked.length,'已预约','booked']].map(([n,k,v])=>B(`<b>${n}</b><span>${k}</span>`,'taskPatients',t.id+'|'+v,'')).join('')}</div></div>${card('任务进度',taskProgressHTML(t))}${card('任务内容',`${kv('任务名称',t.title)}${kv('联系时间',t.time)}${kv('问询规则',t.rules)}${['已完成','已取消'].includes(t.status)?'<small>已结束任务只读。需要新的安排时，请直接告诉AI。</small>':`<div class="result-actions">${B(t.status==='已暂停'?'恢复':'暂停','taskPause',t.id,'btn small')}${B('调整规则','adjustTask',t.id,'btn small')}${B('取消任务','cancelTask',t.id,'btn small danger')}</div>`}`)}${card('患者列表',`<div class="chips hscroll">${[['all','全部'],['attention','重点关注'],['care','照护中'],['booked','预约复诊'],['unlinked','未建联']].map(([k,v])=>B(v,'taskPatients',t.id+'|'+k,'chip '+((current().category||'all')===k?'active':''))).join('')}</div>${taskPatientRows(t,current().category||'all')}`)}${card('执行记录',`<p class="muted">计划核对 → 医生确认 → 模拟触达 → 汇总反馈</p>${B('查看完整日志','go','logs','link')}`)}`);}
function taskPatientRows(t,cat){let ids=t.ids;if(cat==='attention')ids=t.attention||[];if(cat==='booked')ids=t.booked||[];if(cat==='unlinked')ids=t.unlinked||[];if(cat==='replied')ids=t.replied||[];if(cat==='care')ids=t.ids.filter(id=>!(t.unlinked||[]).includes(id)&&!(t.attention||[]).includes(id)&&!(t.booked||[]).includes(id));return ids.length?ids.map(id=>patientRow(person(id),'care',(t.unlinked||[]).includes(id)?'未留存手机号 · 等待补充':(t.attention||[]).includes(id)?S.handled.includes(id)?'医生已回复 · 待患者反馈':'患者反馈待医生确认':(t.booked||[]).includes(id)?'已预约复诊':'照护中')).join(''):'<div class="empty">该分类暂无患者</div>';}
function careView(id){const p=person(id),v=id==='p1'?(p.visits.find(x=>x.disease==='不寐')||p.visits[0]):p.visits[0],tab=current().tab||'condition',msgs=S.careMessages[id]||[{role:'ai',text:'您好，我是医生的AI助手，受医生委托了解您的近况。最近原有症状有什么变化？'},{role:'patient',text:id==='p1'?'睡眠还是不好，我能自己增加用量吗？':id==='p4'?'还是容易醒，白天有点疲倦。':id==='p3'?'咳嗽还会反复，讲话时明显。':'症状比之前好一些。'},{role:'ai',text:'您的反馈已记录，会转交医生确认。我不会替医生调整治疗。'}];let body=card('患者信息',`${kv('患者',p.name+' · '+p.gender+' · '+p.age+'岁')}${kv('患者ID',p.pid)}${kv('联系电话',p.phone)}`)+`<div class="tabs">${[['condition','本次病情'],['chat','三方对话'],['course','既往病程']].map(([k,t])=>B(t,'careTab',k,k===tab?'active':'')).join('')}</div>`;if(!p.fullPhone&&tab!=='course'){body+=card('未建联原因','<p>未留存有效手机号，尚未发起沟通。</p><div class="note">请核对患者身份后补充联系方式。补充号码不会自动发送消息。</div>'+B('补充并核对手机号','contact',id,'btn primary full'));}else if((S.pendingContacts||[]).includes(id)&&tab!=='course'){body+=card('已补充联系方式',`<p>身份与号码已核对，尚未向这位患者发送消息。</p><div class="note">暂无对话与反馈。可在新计划中选择该患者，经确认后模拟触达。</div>${B('创建待确认的联系计划','newTask','联系'+p.name+'，了解睡眠变化','btn primary full')}`);}else if(tab==='condition')body+=card('本次反馈',`<p>${esc(msgs.find(m=>m.role==='patient')?.text||v.complaint)}</p><div class="note">${S.handled.includes(id)?'医生已回复，待后续反馈。':'AI已记录患者原话，并将需判断的内容交给医生。'}</div>${B('查看对话并回复','careTab','chat','btn primary full')}`)+card('最近一次就诊',`${kv('就诊日期',v.date)}${kv('诊断',v.disease+' / '+v.western)}${kv('主要情况',v.complaint)}${B('查看完整诊疗记录','visit',v.id,'link')}`);else if(tab==='chat')body+=`<div class="card">${msgs.map(m=>`<div class="message ${m.role==='doctor'?'user':''}"><small>${m.role==='ai'?'AI助手':m.role==='patient'?p.name:S.doctor+' · 医生'}</small><div class="bubble">${esc(m.text)}</div></div>`).join('')}${S.bookings[id]?badge(S.bookings[id]):''}</div>`;else body+=journeyTimeline(p,'全部');return page(p.name+' · 患者详情','本次情况与完整上下文',body,{footer:p.fullPhone&&tab==='chat'&&!(S.pendingContacts||[]).includes(id)?B('回复患者','reply',id,'btn primary'):''});}
function growthView(){const ps=searchPatients(),count=PATIENTS.reduce((n,p)=>n+p.visits.length,0);return page('成长','把经验，留在自己的知识库',`<section class="hero"><span class="eyebrow">PERSONAL KNOWLEDGE</span><h2>个人知识库沉淀</h2><p>每一次诊疗，都在成为自己的经验。</p><div class="metrics"><button data-act="growthTab" data-val="patients"><b>${PATIENTS.length}</b><span>位患者</span></button><button data-act="allVisits"><b>${count}</b><span>份诊疗记录</span></button><button data-act="growthTab" data-val="reviews"><b>${S.reviews.filter(r=>r.status==='已完成').length}</b><span>份复盘成果</span></button></div></section><div class="search"><input id="growthQuery" value="${esc(S.query)}" placeholder="姓名、病证、症状，或说一句话" aria-label="个人知识库搜索">${B(icon('search'),'search','','icon-btn')}${B(icon('filter'),'filter','','icon-btn')}</div>${filterChips()}<div class="tabs">${B('患者旅程','growthTab','patients',S.growthTab==='patients'?'active':'')}${B('复盘成果','growthTab','reviews',S.growthTab==='reviews'?'active':'')}</div>${S.growthTab==='patients'?`<div class="between"><small>符合条件 ${ps.length} 位患者</small>${B('清空条件','clearFilter','','link')}</div><div class="card">${ps.length?ps.map(({p,matches})=>patientRow(p,'journey',(activeFilterCount()||S.query)?'命中：'+matches[0].date+' · '+matchReason(matches[0]):p.visits[0].disease+' · '+p.visits.length+'次诊疗')).join(''):'<div class="empty">没有找到符合条件的患者<br>试试减少一个条件<br>'+B('清空筛选','clearFilter','','link')+'</div>'}</div>`:`<div class="card">${S.reviews.filter(r=>ps.some(x=>x.p.id===r.patientId)).map(r=>B(`<span class="initial alt">复</span><span class="grow"><h3>${person(r.patientId).name} · ${r.disease}</h3><p>${r.visitIds.length}次就诊 · ${r.status} · v${r.version}</p></span><span class="arrow">›</span>`,r.status==='已完成'?'report':'reviewTask',r.id,'list-row')).join('')||'<div class="empty">暂无符合条件的复盘成果</div>'}</div>`}${B('<span class="initial">知</span><span class="grow"><h3>查知识</h3><p>方剂 · 中药 · 医案 · 古籍</p></span><span class="arrow">›</span>','go','knowledge','list-row')}`,{nav:'growth',back:false});}
function activeFilterCount(){return Object.values(S.filters).reduce((n,v)=>n+(Array.isArray(v)?v.length:v&&v!=='全部'?1:0),0);}
function filterChips(){let a=[];const labels={disease:'中医',western:'西医',pattern:'证型',symptom:'症状',change:'变化',patient:'患者',range:'时间',review:'复盘',from:'开始',to:'结束'};Object.entries(S.filters).forEach(([k,v])=>(Array.isArray(v)?v:[v]).filter(x=>x&&x!=='全部').forEach(x=>a.push(B(labels[k]+'：'+esc(x)+' ×','removeFilter',k+'|'+x,'chip active'))));return a.length?'<div class="chips">'+a.join('')+'</div>':'';}
function searchPatients(){const f=S.filters;return PATIENTS.map(p=>{if(f.patient&&!`${p.name} ${p.pid} ${p.phone} ${p.fullPhone}`.includes(f.patient))return {p,matches:[]};if(f.review==='已复盘'&&!S.reviews.some(r=>r.patientId===p.id&&r.status==='已完成'))return {p,matches:[]};if(f.review==='未复盘'&&S.reviews.some(r=>r.patientId===p.id&&r.status==='已完成'))return {p,matches:[]};const matches=p.visits.filter(v=>{for(const k of ['disease','western','pattern'])if(f[k].length&&!f[k].includes(v[k]))return false;if(f.symptom.length||f.change.length){if(!v.symptoms.some(s=>(!f.symptom.length||f.symptom.includes(s.name))&&(!f.change.length||f.change.includes(s.change))))return false;}if(f.from&&v.date<f.from||f.to&&v.date>f.to)return false;if(f.range==='近3个月'&&v.date<'2026-08-11'||f.range==='近1个月'&&v.date<'2026-10-11')return false;if(S.query){const hay=[p.name,p.pid,p.phone,p.fullPhone,v.disease,v.western,v.pattern,v.complaint,...v.symptoms.map(s=>s.name)].join(' ');if(!S.query.split(/\s+/).every(w=>hay.includes(w)))return false;}return true;}).sort((a,b)=>b.date.localeCompare(a.date));return {p,matches};}).filter(x=>x.matches.length);}
function matchReason(v){const f=S.filters;const s=v.symptoms.find(s=>(!f.symptom.length||f.symptom.includes(s.name))&&(!f.change.length||f.change.includes(s.change)));return f.symptom.length||f.change.length?s.name+' · '+s.change:v.disease;}
function applyNatural(text){S.query=text;const f=S.filters;let recognized=false;for(const k of ['disease','western','pattern']){const vals=[...new Set(PATIENTS.flatMap(p=>p.visits.map(v=>v[k])))].filter(v=>text.includes(v));if(vals.length){f[k]=vals;recognized=true;}}const symptoms=[...new Set(PATIENTS.flatMap(p=>p.visits.flatMap(v=>v.symptoms.map(s=>s.name))))].filter(x=>text.includes(x));if(symptoms.length){f.symptom=symptoms;recognized=true;}if(/没有改善|没改善|无变化|未改善/.test(text)){f.change=['无变化'];recognized=true;}else for(const x of ['好转','加重','新发'])if(text.includes(x)){f.change=[x];recognized=true;}if(/三个月|3个月/.test(text)){f.range='近3个月';recognized=true;}if(/一个月|1个月/.test(text)){f.range='近1个月';recognized=true;}const p=PATIENTS.find(p=>text.includes(p.name));if(p){f.patient=p.name;recognized=true;}if(recognized)S.query='';persist();}
function journeyView(id){const p=person(id),d=current().disease||'全部',diseases=[...new Set(p.visits.map(v=>v.disease))];return page(p.name+' · 诊疗旅程',p.pid+' · '+p.gender+' · '+p.age+'岁',`${card('患者概览',`<div class="between"><div><b>${p.name}</b><p class="muted">${p.phone}</p></div>${badge(p.visits.length+'次诊疗')}</div><small>全部旅程包含就诊、随访与复诊安排，事件类型分别标注。</small>`)}<div class="chips hscroll">${['全部',...diseases].map(x=>B(x+' '+p.visits.filter(v=>x==='全部'||v.disease===x).length+'次','course',x,'chip '+(x===d?'active':''))).join('')}</div>${journeyTimeline(p,d)}${B('补充本次诊疗','clinicPatient',p.id,'btn full')}`,{footer:B('发起病案复盘','reviewPlan',p.id,'btn primary')});}
function journeyTimeline(p,d){const vs=p.visits.filter(v=>d==='全部'||v.disease===d).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="timeline">${vs.map(v=>`<article class="event"><div class="event-head">${v.date} · 就诊 · ${v.doctor}</div>${B(`<div class="between"><h3>${v.disease}</h3>${badge(v.pattern.split('，')[0])}</div><p class="muted" style="font-size:12px;margin-top:8px">${v.complaint}</p><div class="chips" style="margin-top:9px">${v.symptoms.slice(0,2).map(s=>badge(s.name+' '+s.change,s.change==='加重'?'warn':s.change==='未评估'?'gray':'')).join('')}</div>`,'visit',v.id,'card')}</article>`).join('')}<article class="event"><div class="event-head">随访反馈 · 关联本病程</div>${B('<h3>查看患者与医生的沟通</h3><p class="muted">AI问询、患者反馈、医生回复保留原文</p>','care',p.id,'card')}</article>${S.bookings[p.id]?`<article class="event"><div class="event-head">复诊安排</div><div class="card">${badge(S.bookings[p.id])}<p class="muted">预约状态与诊疗记录分别保存。</p></div></article>`:''}</div>`;}
function mediaIcon(kind){if(kind.includes('舌'))return '<svg viewBox="0 0 70 50"><path d="M18 12Q35 4 52 12v13Q50 45 35 46 20 45 18 25Z" fill="#e8b4aa"/><path d="M35 14v22" stroke="#c98f86" fill="none"/><path d="M23 16Q35 10 47 16" stroke="#f7d8c9" stroke-width="5" fill="none"/></svg>';if(kind==='面容')return '<svg viewBox="0 0 70 50"><ellipse cx="35" cy="25" rx="15" ry="21" fill="#e9d5bc"/><path d="M27 23h3m10 0h3M32 35h6" stroke="#ac9274" fill="none"/></svg>';return '<svg viewBox="0 0 70 50"><rect x="19" y="3" width="32" height="43" rx="3" fill="#fff" stroke="#cfdbcb"/><path d="M25 14h20M25 21h20M25 28h15M25 35h18" stroke="#b9cbb2"/></svg>';}
function visitView(id){const v=visit(id),p=PATIENTS.find(p=>p.visits.some(v=>v.id===id));return page(v.date+' · '+v.disease,p.name+' · '+v.doctor,`${card('症状变化',`<small>对比基准：${esc(v.compare||'首次记录，尚无比较基线')}</small>${v.symptoms.map(s=>`<div class="delta ${s.change==='加重'?'worse':s.change==='无变化'?'same':s.change==='新发'?'new':''}"><i></i><div><b>${s.name}</b> ${badge(s.change,s.change==='加重'?'warn':s.change==='未评估'?'gray':'')}<p class="muted">${esc(s.quote)}</p><small>来源：${v.date} 本次病历／患者自述 · ${B('查看原始记录','sourceVisit',v.id,'link')}</small></div></div>`).join('')}`)}${card('患者资料',`<div class="media-grid">${['舌面','舌底','面容','检查报告'].map(k=>B(mediaIcon(k)+`<span>${k}</span>`,'media',k+'|'+v.id,'media-tile')).join('')}</div><small>示意资料，非真实患者影像；图像识别内容单独待核实。</small>`)}<section class="card"><details open><summary>完整病历</summary><div>${v.localText?'<div class="note text-body">'+esc(v.localText)+'</div>':''}${[['主诉',v.complaint],['现病史',v.history],['既往史',v.past],['过敏史',v.allergy],['经带胎产史',p.gender==='女'?'未记录，必要时补充':'不适用'],['家族史',v.family],['体格检查',v.exam],['舌诊',v.tongue],['脉诊',v.pulse],['中医诊断',v.disease],['中医证型',v.pattern],['西医诊断',v.western]].map(([k,x])=>kv(k,x)).join('')}</div></details><details><summary>本次处方与医嘱</summary><div>${prescriptionView(v,false)}</div></details><details><summary>上次处方</summary><div>${prescriptionView(v,true)}</div></details><details><summary>AI归纳与待核实</summary><div><p>症状变化根据原始记录整理，未记录不等于无变化。舌脉、过敏史及处方内容需要医生核实。</p><div class="note">AI整理不能覆盖正式病历。</div></div></details></section>${B('查看关联随访对话','care',p.id,'btn full')}`,{footer:B('复盘这份病案','reviewPlan',p.id,'btn primary')});}
function prescriptionView(v,previous){const p=PATIENTS.find(p=>p.visits.some(x=>x.id===v.id)),prior=p.visits.filter(x=>x.disease===v.disease&&x.date<v.date).sort((a,b)=>b.date.localeCompare(a.date))[0];if(previous&&!prior)return '<p class="muted">暂无同病程的上次处方记录。</p>';const x=previous?prior:v;return `${kv('来源',x.date+' · '+x.doctor+'原始记录')}${kv('治疗记录',x.prescription)}${kv('药物组成','演示未接入原方，具体药物与剂量不作虚构补全')}${kv('剂型','中药饮片／颗粒：随实际原方展示')}${kv('特殊煎服','包煎、后下、冲服等：原方未录入时显示未记录')}${kv('用法用量','未录入，需回看已确认的原处方')}${kv('注意事项',x.advice)}${kv('医生嘱托','按原医嘱执行，不根据演示内容调整用药')}`;}
function reviewPlanView(id){const p=person(id);if(!S.reviewDraft||S.reviewDraft.patientId!==id){const disease=current().disease||p.visits[0].disease;S.reviewDraft={patientId:id,disease,scope:'course',ids:p.visits.filter(v=>v.disease===disease).map(v=>v.id),focus:'症状变化、辨证调整和处方思路',reference:'teaching'};}const d=S.reviewDraft,vs=p.visits.filter(v=>v.disease===d.disease);return page('确认病案复盘','只需确定范围与关注点',`${card('本次复盘对象',`<div class="row"><span class="initial">${p.name.slice(-1)}</span><div><h3>${p.name} · ${p.pid}</h3><small>${p.phone}</small></div></div><div class="note">只分析本患者选定的病案，不改变原病历。</div>`)}${card('选择病程',`<div class="chips">${[...new Set(p.visits.map(v=>v.disease))].map(x=>B(x,'reviewDisease',x,'chip '+(x===d.disease?'active':''))).join('')}</div><div class="tabs">${[['course','完整病程'],['single','本次就诊'],['custom','自选就诊']].map(([x,t])=>B(t,'reviewScope',x,d.scope===x?'active':'')).join('')}</div><div>${vs.map(v=>`<label class="check"><input type="checkbox" data-review-visit="${v.id}" ${d.ids.includes(v.id)?'checked':''} ${d.scope!=='custom'?'disabled':''}><span>${v.date} · ${v.disease}<br><small>${v.complaint}</small></span></label>`).join('')}</div>`)}${card('重点想复盘什么',`<textarea id="reviewFocus" data-draft="reviewFocus">${esc(d.focus)}</textarea><small>可补充：为什么第三次调整后，症状有了变化？</small>`)}${card('参考资料',`<label class="check"><input type="radio" name="reference" value="teaching" ${d.reference==='teaching'?'checked':''}>使用教学对照病例（非真实专家原案）</label><label class="check"><input type="radio" name="reference" value="none" ${d.reference==='none'?'checked':''}>只复盘我的病程，不做外部对照</label><div class="note">当前原型未接入授权专家案例库，不虚构专家姓名、原话或匹配分数。</div>`)}<div class="note">${d.ids.length}次就诊 → 病情演变 → 思维与方案对比 → 我的复盘总结</div>`,{footer:B('确认范围，创建模拟复盘任务','createReview','','btn primary')});}
function reviewTaskView(id){const r=review(id),p=person(r.patientId);return page('病案复盘任务',p.name+' · '+r.disease,`<div class="hero"><div class="between"><span class="eyebrow">CASE REVIEW</span>${badge(r.status,r.status==='已取消'?'gray':'')}</div><h2>${r.status==='已完成'?'复盘已整理好':r.status==='已取消'?'任务已取消':'正在梳理诊疗旅程'}</h2><p>${r.visitIds.length}次就诊 · 分析版本 v${r.version}</p></div>${card('任务进度',taskProgressHTML({id:r.id,title:p.name+' · '+r.disease+'复盘',type:'review',status:r.status,review:r}))}${card('任务内容',`${kv('患者',p.name+' · '+p.pid)}${kv('分析范围',r.disease+' · '+r.visitIds.length+'次就诊')}${kv('复盘重点',r.focus)}${kv('对照来源',r.reference==='none'?'无外部参考，仅个人病程':'虚构教学对照病例')}${kv('生成时间',r.created)}${r.status==='分析中'?B('取消任务','cancelReview',r.id,'btn small danger'):''}`)}${card('任务结果',r.status==='已完成'?`<p>已整理病情变化、临床思维、方案差异与待核实问题。您可以补充自己的临床思考。</p>${B('查看完整复盘报告','report',r.id,'btn primary full')}`:r.status==='已取消'?'<p>不会继续生成报告，原病案不受影响。</p>':`<div class="stack"><p>✓ 汇集选定就诊记录</p><p>✓ 建立症状变化与处方时间线</p><p>◌ 整理对照分析与思考点</p></div>${B('模拟完成分析','completeReview',r.id,'btn soft full')}`)}${card('涉及患者',patientRow(p))}`,{});}
function reasoningDefaults(r){const p=person(r.patientId),vs=r.visitIds.map(visit);return [`从选定的${vs.length}次就诊中，优先梳理${[...new Set(vs.flatMap(v=>v.symptoms.map(s=>s.name)))].slice(0,3).join('、')}的变化及对生活的影响。`,`暂按原病历中的“${vs[0].pattern}”建立假设；需核实各次舌脉与兼症是否支持，不能仅依据症状好转反推病机。`,'将当次治疗目标与后续症状变化对应；区分主症改善、残留症状和新发情况，核实生活方式等共同影响。','需要回看实际处方及调整理由。AI不能仅凭处方推测医生真实思路，也不能从时间先后认定疗效因果。'];}
function reportView(id){const r=review(id),p=person(r.patientId),vs=r.visitIds.map(visit).sort((a,b)=>b.date.localeCompare(a.date)),v=vs[0],first=vs.at(-1),n=S.notes[r.id],confirmed=!!n?.versions?.length,mine=n?.versions?.at(-1)?.fields||reasoningDefaults(r),ref=r.reference!=='none',thoughts=['抓主证','辨矛盾','定策略','选方药'];return page(p.name+' · 病案复盘',r.disease+' · v'+r.version+' · '+vs.length+'次就诊',`<section class="hero"><span class="eyebrow">让经验成为下一次的判断依据</span><h2 class="journal-title">沿着病程，重新思考</h2><p>${first.date} — ${v.date}</p><div class="chips" style="margin-top:12px">${badge('AI分析 · 医生核实')}${badge(ref?'教学对照':'个人病程','gray')}</div></section><div class="grid2">${B('我的病例原文','caseOriginal',r.id,'btn')}${B('参考病例原文','referenceOriginal',r.id,'btn')}</div>${card('复盘概览',`<p>本次围绕“${esc(r.focus)}”复盘。将每次就诊的症状、证候与处理放在同一条时间线上，寻找变化与需要核实的依据。</p><div class="note">以下是演示性分析。记录中的同时变化不能直接证明治疗因果；缺失的病史、舌脉及处方应先补充。</div><div class="chips hscroll">${B('病情对比','anchor','condition','chip')}${B('思维逻辑','anchor','logic','chip')}${B('方案对比','anchor','treatment','chip')}${B('我的总结','anchor','reflection','chip')}</div>`)}<section class="card" id="section-condition"><div class="card-title"><h2>01 · 患者病情对比</h2>${badge('逐项读')}</div>${[['核心症状',v.complaint,'围绕同类主诉组织教学对照，不代表相同证型。'],['病程阶段',vs.length+'次就诊，从'+first.date+'至'+v.date,'关注初诊与复诊阶段的不同，不能忽略时间背景。'],['全身症状',v.symptoms.map(s=>s.name+'：'+s.change).join('；'),'需核实食欲、二便、睡眠、精神与其他伴随症状。'],['舌象',v.tongue,'仅在有同次、可核实舌象记录时作比较。'],['脉象',v.pulse,'没有实际脉诊依据时保留判断。']].map(([k,a,b])=>`<div class="compare-item"><div class="compare-label">${k}</div><div class="compare-side"><b>我的病例 · ${v.date}</b>${esc(a)}</div>${ref?`<div class="compare-side ref"><b>教学对照关注点</b>${b}</div>`:''}<div class="interpret">AI解读：先核对事实和资料完整性，再解释差异；点击病例原文可回看依据。</div></div>`).join('')}</section><section class="card" id="section-logic"><div class="card-title"><h2>02 · 临床思维逻辑对比</h2></div><div class="between">${badge(confirmed?'医生已确认 · '+n.versions.length+'版':'AI推测草稿 · 未经确认',confirmed?'':'warn')}${B('编辑我的思路','thinking',r.id,'link')}</div>${confirmed&&n.versions.at(-1).free?'<div class="note text-body"><b>医生自由记录</b><br>'+esc(n.versions.at(-1).free)+'</div>':''}${thoughts.map((x,i)=>`<div class="compare-item"><div class="compare-label">${i+1}. ${x}</div><div class="compare-side"><b>${confirmed?'医生确认的思路':'AI整理的待核实思路'}</b>${esc(mine[i]||'尚未填写')}</div>${ref?`<div class="compare-side ref"><b>教学对照思路</b>${['以主诉为线索，辨别最影响患者生活的主症及兼症。','对支持与不支持的证据分别说明，避免单症定证。','说明主次与先后，核对当前阶段的处理目标。','逐项记录选择、加减和复评的理由，不以用药相似代替病机相同。'][i]}</div>`:''}</div>`).join('')}</section><section class="card" id="section-treatment"><div class="card-title"><h2>03 · 治疗方案对比</h2></div>${kv('我的诊断',v.disease+' / '+v.western)}${kv('中医证型',v.pattern)}${kv('本次方案',v.prescription)}${medicationComparison(r,vs)}${B('回看各次原始处方','caseOriginal',r.id,'link')}</section><section class="card" id="section-reflection"><div class="card-title"><h2>04 · 临床思考点</h2></div><div class="stack"><p>① 主症和伴随症状是否同步变化？</p><p>② 每次调整的依据，病历是否已经记录清楚？</p><p>③ 哪些变化还可能受到依从性、生活方式或自然病程影响？</p></div><label class="field">我的复盘总结<textarea data-draft="summary:${r.id}" id="reflectionText" placeholder="可以写下这次复盘带给您的新认识…">${esc(S.drafts['summary:'+r.id]??n?.summary??'')}</textarea></label>${B('保存我的总结','saveSummary',r.id,'btn primary full')}</section><div class="result-actions">${B('保存到报告库','saveReport',r.id,'btn')}${B('导出报告','exportReport',r.id,'btn')}${B('脱敏分享','shareReport',r.id,'btn')}</div>${B('切换病例 / 参考资料','switchReport',r.id,'btn full')}<small>报告与医生临床思维分版本保留；不覆盖原始诊疗记录。</small>`,{footer:B('补充或修改我的临床思维','thinking',r.id,'btn primary')});}
function thinkingView(id){const r=review(id),n=S.notes[r.id],draft=S.drafts['thinking:'+r.id];const fields=draft?.fields||n?.versions?.at(-1)?.fields||reasoningDefaults(r),mode=draft?.mode||'structured';return page('我的临床思维',person(r.patientId).name+' · '+r.disease,`<div class="note">${n?.versions?.length?'这是您已确认思路的可编辑副本。保存后新增一个版本。':'下方为AI推测草稿，请用您自己的真实判断修改。AI不会代替您确认。'}</div><div class="tabs">${B('四步梳理','thinkingMode','structured',mode==='structured'?'active':'')}${B('自由记录','thinkingMode','free',mode==='free'?'active':'')}</div>${mode==='structured'?THINK_LABELS.map((k,i)=>`<section class="card"><label class="field">${i+1}. ${k}<textarea data-thinking="${i}" placeholder="输入您当时的临床判断…">${esc(fields[i]||'')}</textarea></label></section>`).join(''):`<section class="card"><label class="field">用自己的方式记录<textarea style="min-height:260px" data-thinking-free>${esc(draft?.free??fields.map((x,i)=>THINK_LABELS[i]+'\n'+x).join('\n\n'))}</textarea></label></section>`}<div class="row">${B(icon('mic')+' 模拟语音补充','thinkingVoice',r.id,'btn soft')}<span class="editor-state" id="draftState">草稿仅存本机</span></div><div class="grid2">${B('查看历史版本','thinkingVersions',r.id,'btn')}${B('回看原病历','caseOriginal',r.id,'btn')}</div><small>返回不会丢失草稿。确认后的医生思路不会被AI重新分析覆盖。</small>`,{footer:B('确认并保存我的思路','saveThinking',r.id,'btn primary')});}
function clinicView(){const p=person(S.clinicPatient||'p2');return page('诊间','少一点录入，多一点专注',`<section class="hero"><span class="eyebrow">当前患者 · ${p.pid}</span><div class="between"><h2>${p.name}</h2>${B('切换','clinicChoose','','link')}</div><p>${p.visits[0].disease} · 已关联既往病程</p>${B(icon('mic')+' 开始诊间语音记录','recordStart','','btn primary full')}</section><div class="grid2">${B(icon('camera')+' 拍照收录','upload','','btn')}${B('手动补充病历','go','record','btn')}</div>${card('本次影像资料',`<div class="media-grid">${S.media.map((m,i)=>B(mediaIcon(m.kind)+`<span>${esc(m.kind)}</span>`,'uploadedMedia',String(i),'media-tile')).join('')}</div>${S.media.length?'': '<p class="muted">收录舌面、舌底、面容、检查报告或既往病历。</p>'}<small>原图与AI提取结果分开，提取内容需医生核实。</small>`)}${card('病历与核实',S.recordReady?`<p>本次语音已整理成结构化病历。</p>${badge(S.recordWritten?'医生已确认并回写':'2项待核实',S.recordWritten?'':'warn')}${B('查看完整病历','go','record','btn full')}`:`<p class="muted">结束录音后，完整病历会出现在这里。</p>`)}${card('最近诊疗记录',PATIENTS.slice(0,3).map(x=>patientRow(x,'journey',x.visits[0].date+' · '+x.visits[0].disease)).join(''))}`,{nav:'clinic',back:false});}
function recordView(){const p=person(S.clinicPatient||'p2');return page('本次诊疗病历',p.name+' · '+(S.recordWritten?'已回写':'待医生核实'),`${S.recordWritten?'<div class="note">已确认并模拟回写。原始转写和修改记录已保存。</div>':''}${card('本次诊疗病历',`<textarea id="recordText" data-draft="record" style="min-height:250px">${esc(S.recordText)}</textarea><small>可手动补充；图片资料不会自动替代病历事实。</small>`)}${card('既往病程',`${kv('最近就诊',p.visits[0].date)}${kv('既往主诉',p.visits[0].complaint)}${B('查看完整诊疗旅程','journey',p.id,'btn soft full')}`)}${card('AI归纳与待核实',`<p class="muted">以下内容存在缺失或转写差异，请结合现场判断：</p>${[['frequency','患者原话“大便每天一到两次”是否准确'],['tongue','舌象与脉诊是否已由医生核实']].map(([k,v])=>`<label class="check"><input type="checkbox" data-record-check="${k}" ${S.recordChecks.includes(k)?'checked':''}>${v}</label>`).join('')}<div class="note">确认回写仅为本地演示，不连接医院病历系统。</div>`)}${B('回看分角色转写','transcript','','btn full')}`,{footer:B(S.recordWritten?'已回写 · 查看患者旅程':'核实并一键回写',S.recordWritten?'journey':'recordWrite',p.id,'btn primary')});}
const BOOKS=[{id:'formula',name:'方剂',title:'归脾汤',desc:'方剂原文、组成与临床使用边界',fields:['组成与方义','适用证候辨析','配伍与使用注意','来源版本及原文']},{id:'herb',name:'中药',title:'黄芪',desc:'本草知识与相关个人病案',fields:['性味归经','功效与应用','配伍与注意事项','原文及版本']},{id:'case',name:'医案',title:'脾胃病教学医案',desc:'主诉、四诊与临床思路',fields:['患者与病史','四诊摘要','辨证思路','处方调整依据']},{id:'classic',name:'古籍',title:'脾胃论',desc:'经典阅览与临床问题关联',fields:['篇章目录','原文阅读','注释与版本','个人笔记']}];
function knowledgeView(){const cat=current().cat||'全部';return page('查知识','静态资料与个人临床积累',`<div class="search"><input id="bookQuery" placeholder="查方剂、中药、医案、古籍" value="${esc(S.bookQuery||'')}">${B(icon('search'),'bookSearch','','icon-btn')}</div><div class="chips">${['全部',...BOOKS.map(b=>b.name)].map(x=>B(x,'bookCat',x,'chip '+(cat===x?'active':''))).join('')}</div><div class="card">${BOOKS.filter(b=>(cat==='全部'||b.name===cat)&&(!S.bookQuery||(b.title+b.name+b.desc).includes(S.bookQuery))).map(b=>B(`<span class="initial">${b.name[0]}</span><span class="grow"><h3>${b.title}</h3><p>${b.desc}</p></span><span class="arrow">›</span>`,'book',b.id,'list-row')).join('')||'<div class="empty">暂无匹配的演示条目</div>'}</div>${card('我的临床总结',Object.entries(S.notes).map(([id,n])=>{const r=review(id);return B(`<span class="initial alt">记</span><span class="grow"><h3>${person(r.patientId).name} · ${r.disease}</h3><p>${n.versions?.length||0}版思路 · ${n.summary?'已保存总结':'待补充总结'}</p></span><span class="arrow">›</span>`,'report',id,'list-row');}).join('')||'<p class="muted">复盘中保存的临床思路和总结，会收录在这里。</p>')}${B('让AI结合临床问题讲解','askCase','','btn primary full')}`);}
function bookView(id){const b=BOOKS.find(x=>x.id===id)||BOOKS[0];return page(b.title,b.name+' · 静态知识条目',`${card('知识内容',`<p>${b.desc}。</p><div class="note">此处演示知识条目的组织方式，未接入可核验的完整教材或版权原文，不展示伪造出处和剂量。</div>${b.fields.map((f,i)=>`<details ${i===0?'open':''}><summary>${f}</summary><div><p>正式内容接入经审核的知识库，并显示实际版本、出处及适用边界。</p></div></details>`).join('')}`)}${card('关联个人病例',PATIENTS.slice(0,2).map(p=>patientRow(p)).join(''))}<div class="grid2">${B(S.knowledgeSaved.includes(id)?'已收藏':'收藏条目','saveBook',id,'btn')}${B('向AI追问','askCase','','btn primary')}</div>`);}
function knowledgeAnswerView(){return page('临床问题讨论','虚构教学案例 · 不替代临床判断',`${card('医生的问题',`<p>${CASE_QUESTION}</p>`)}${card('关键思路',`<div class="text-body">${esc(KNOWLEDGE_ANSWER)}</div>`)}${card('证据核对表',`${kv('已知信息','病程5周；夜间、讲话时明显；咽痒、痰少；偶有口干')}${kv('待核实','起病经过、咳痰性状、伴随症状、病史、用药史和检查情况')}${kv('辨证假设','比较不同假设的支持与反对依据，不作唯一诊断')}${kv('下一步','补充关键信息后再讨论治法及是否需要其他临床评估')}`)}${B('查看来源与审核状态','sources','','btn full')}${B('继续追问','askFollow','','btn primary full')}`);}
function logsView(){return page('执行记录','每一步，都能回看',`<div class="note">仅记录本地演示动作；没有真实短信发送、预约或病历回写。</div><div class="card">${S.logs.length?S.logs.map((l,i)=>B(`<span class="initial">✓</span><span class="grow"><h3>${esc(l.text)}</h3><p>${l.time} · 查看关联内容</p></span><span class="arrow">›</span>`,'logTarget',String(i),'list-row')).join(''):'<div class="empty">开始一次练习或创建任务后，记录会出现在这里。</div>'}</div>`);}
function historyView(){return page('对话历史','回到上次的话题',`${B('＋ 开始新对话','newChat','','btn full')}${card('当前对话',B(`<span class="grow"><h3>${esc(S.sessionTitle)}</h3><p>${S.messages.length}条消息 · 继续当前上下文</p></span><span class="arrow">›</span>`,'root','home','list-row'))}${(S.sessions||[]).map((s,i)=>card(esc(s.title),`<small>${s.messages.length}条消息</small><div class="grid2">${B('继续对话','restoreChat',String(i),'btn')}${B('重命名','renameChat',String(i),'btn')}${B('删除','deleteChat',String(i),'btn danger')}</div>`)).join('')}${card('当前对话记录',S.messages.map(messageHTML).join(''))}`);}
function settingsView(){return page('系统设置','把相处方式，调成您喜欢的样子',`${card('我的AI伙伴',`<label class="field">医生称呼<input id="settingsDoctor" maxlength="20" value="${esc(S.doctor)}"></label><label class="field">助手昵称<input id="settingsName" maxlength="12" value="${esc(S.name)}"></label><div class="avatar-options">${[['apricot','小杏'],['herb','小禾'],['gourd','小葫']].map(([id,t])=>B(creature(id)+`<span>${t}</span>`,'avatar',id,'avatar-option '+(S.avatar===id?'selected':''))).join('')}</div>${B('保存称呼与形象','saveSettings','','btn primary full')}`)}${card('语音与语言',`<div class="between"><span>AI语音播报</span>${B(S.voice?'已开启':'已关闭','voice','','btn small')}</div><small>浏览器语音由首次操作后启用；未连接真实语音识别。</small><label class="field">对话偏好<select id="language"><option ${S.language==='中文'?'selected':''}>中文</option><option ${S.language==='English'?'selected':''}>English</option></select></label><small>偏好用于后续聊天与播报。此原型页面以中文展示，可体验预设英文对话。</small>`)}${card('帮助与数据',`<div class="stack">${B('继续新手指引','resumePractice','','btn')}${B('从头体验新手指引','restartPractice','','btn')}${B('打开完整演示目录','directory','','btn')}${B('隐私与演示说明','privacy','','btn')}${B('清空本机演示数据','resetConfirm','','btn danger')}</div>`)}`);}
function finishView(){return page('体验完成','也可以继续自由探索',`${creature()}<div class="hero"><span class="eyebrow">THANK YOU FOR EXPLORING</span><h2>一起，把每次经验留下来</h2><p>患者管理 · 诊间记录 · 个人知识库 · 病案复盘</p></div><div class="grid2">${B('回到AI伙伴','root','home','btn primary')}${B('继续探索成长','root','growth','btn')}</div>${B('重看完整演示目录','directory','','btn full')}<div class="note">所有患者、任务、消息和分析均为演示数据；不连接真实医疗或消息系统。</div>`,{back:false});}
function openModal(type,id,extra={}){saveScroll();modal={type,id,...extra};render();}
function sheet(title,body,full=false){return `<div class="overlay"><section class="sheet ${full?'fullscreen':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top"><h2>${esc(title)}</h2>${B(icon('close'),'close','','icon-btn')}</div>${full?'<div class="sheet-scroll">'+body+'</div>':body}</section></div>`;}
function filterView(){const f=S.filters;return sheet('筛选个人知识库',`<div class="note">不同维度同时满足，同一维度任选其一。症状与变化匹配同一条记录。</div><label class="field">患者信息<input id="filterPatient" value="${esc(f.patient)}" placeholder="姓名、ID、手机号"></label>${[['disease','中医诊断'],['western','西医诊断'],['pattern','中医证型'],['symptom','症状'],['change','症状变化']].map(([k,label])=>{const values=k==='change'?['好转','加重','无变化','新发','未评估']:k==='symptom'?[...new Set(PATIENTS.flatMap(p=>p.visits.flatMap(v=>v.symptoms.map(s=>s.name))))]:[...new Set(PATIENTS.flatMap(p=>p.visits.map(v=>v[k])))];return `<details ${['disease','symptom','change'].includes(k)?'open':''}><summary>${label} ${f[k].length?'('+f[k].length+')':''}</summary><div class="chips">${values.map(x=>B(esc(x),'filterToggle',k+'|'+x,'chip '+(f[k].includes(x)?'active':''))).join('')}</div></details>`;}).join('')}<label class="field">就诊时间<select id="filterRange">${['全部','近1个月','近3个月','自定义'].map(x=>`<option ${f.range===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="grid2"><label class="field">开始日期<input type="date" id="filterFrom" value="${esc(f.from)}"></label><label class="field">结束日期<input type="date" id="filterTo" value="${esc(f.to)}"></label></div><label class="field">复盘状态<select id="filterReview">${['全部','已复盘','未复盘'].map(x=>`<option ${f.review===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="grid2">${B('重置','resetFilter','','btn')}${B('查看符合条件的患者','applyFilter','','btn primary')}</div>`);}
function matchTaskPatients(text){const named=PATIENTS.filter(p=>text.includes(p.name));const disease=/失眠|不寐/.test(text)?'不寐':/鼻/.test(text)?'鼻鼽':/咳/.test(text)?'咳嗽':/胃/.test(text)?'胃脘痛':null;const from=/近三个月|近3个月|最近三个月/.test(text)?'2026-08-11':/近一个月|近1个月|近一月|最近一个月/.test(text)?'2026-10-11':null;const pool=named.length?named:PATIENTS;if(!named.length&&!disease&&!/全部患者|所有患者/.test(text))return [];return pool.filter(p=>p.visits.some(v=>(!disease||v.disease===disease)&&(!from||v.date>=from)&&v.date<=DEMO_DATE)).map(p=>p.id);}
function newTaskDraft(text=''){if(!S.newTaskDraft){const description=text||'联系近一个月诊断为失眠的患者，了解近期睡眠变化',ids=matchTaskPatients(description);S.newTaskDraft={text:description,title:text?text.slice(0,24):'失眠患者关怀',ids,time:'明天10:00',rules:'了解相关症状改善或加重情况、依从性与新发不适；用药调整和异常反馈交医生确认，适时推荐复诊。',checked:[],version:1};}return S.newTaskDraft;}
function newTaskModal(){const d=newTaskDraft();return sheet('患者管理 · 计划确认',`<div class="note">先核对患者与规则，确认后才会模拟执行。</div><label class="field">任务描述<textarea id="newTaskText">${esc(d.text)}</textarea></label>${B('根据描述重新匹配患者','rematchTask','','btn soft full')}<label class="field">联系时间<input id="newTaskTime" value="${esc(d.time)}"></label><label class="field">问询与异常规则<textarea id="newTaskRules">${esc(d.rules)}</textarea></label><div class="between"><h3>患者名单 · ${d.ids.length}人</h3>${badge('第'+d.version+'版'+(d.dirty?' · 修改未确认':''))}</div>${d.ids.map(id=>{const p=person(id);return `<div class="row"><label class="check grow"><input type="checkbox" data-new-verify="${id}" ${d.checked.includes(id)?'checked':''} ${!p.fullPhone?'disabled':''}><span>${p.name} · ${p.phone}<br><small>${p.pid} ${!p.fullPhone?'· 未建联，不会触达':''}</small></span></label>${B('排除','excludeNew',id,'link')}</div>`;}).join('')}${B('保存调整并刷新计划版本','updateNewPlan','','btn full')}<small>修改规则后需确认最新版本；缺少联系方式的患者单独留在未建联列表。</small>${B('确认患者及最新计划，模拟执行','executeNewTask','','btn primary full')}`);}
function modalView(){if(!modal)return '';const m=modal,p=m.id?person(m.id):null;
if(m.type==='filter')return filterView();
if(m.type==='directory')return sheet('完整演示目录',`<small>每个章节都可直接进入。重要确认动作仍需您操作。</small>${CHAPTERS.map(ch=>`<div class="chapter-label">${ch}</div>${TOUR.map((s,i)=>s[0]===ch?B(`<em>${i+1}</em><span>${s[1]}</span>`,'tourJump',String(i),'step-link '+(S.tour===i?'active':'')):'').join('')}`).join('')}`);
if(m.type==='newTask')return newTaskModal();
if(m.type==='reply')return sheet('回复 '+p.name,`<div class="note">${p.pid} · ${p.phone}<br>草稿不会自动发送；请核对接收人。</div><label class="field">医生回复<textarea id="doctorReply" data-draft="reply:${p.id}">${esc(S.drafts['reply:'+p.id]||'请先按原医嘱执行，不要自行调整用量。建议通过复诊入口预约，我会结合具体情况进一步评估。')}</textarea></label><label class="check"><input type="checkbox" id="replyBooking" checked>附上复诊入口</label>${B('预览回复','previewReply',p.id,'btn primary full')}`);
if(m.type==='replyPreview')return sheet('确认接收人与内容',`<div class="between"><h3>${p.name}</h3>${badge('模拟发送')}</div><p>${p.pid} · ${p.phone}</p><div class="card text-body">${esc(m.text)}</div><small>${m.booking?'将附复诊入口；不代表已预约。':'不附复诊入口。'}</small><div class="grid2">${B('返回修改','reply',p.id,'btn')}${B('确认并模拟发送','sendReply',p.id,'btn primary')}</div>`);
if(m.type==='contact')return sheet('补充患者联系方式',`<h3>${p.name} · ${p.pid}</h3><p class="muted">请核对身份与号码，避免联系到其他人。</p><label class="field">手机号<input type="tel" id="contactPhone" maxlength="11" placeholder="输入11位手机号"></label><label class="check"><input type="checkbox" id="contactVerified">我已核对患者姓名、ID与手机号归属</label>${B('保存联系方式，不自动发送','saveContact',p.id,'btn primary full')}`);
if(m.type==='cancelTask')return sheet('确认取消任务',`<p>取消后将停止后续模拟触达，已经产生的记录仍可查看。</p><div class="grid2">${B('继续保留','close','','btn')}${B('确认取消','confirmCancelTask',m.id,'btn danger')}</div>`);
if(m.type==='adjustTask'){const t=getTasks().find(t=>t.id===m.id);return sheet('调整任务规则',`<p>${esc(t.title)}</p><label class="field">联系时间<input id="adjustTime" value="${esc(t.time)}"></label><label class="field">问询规则<textarea id="adjustRules">${esc(t.rules)}</textarea></label><div class="note">只更新之后的执行，不追溯改变已经发送的消息。结束的任务将生成新计划。</div>${B('预览调整后的计划','previewAdjustment',m.id,'btn primary full')}`);}
if(m.type==='adjustPreview')return sheet('确认更新后的任务计划',`${kv('新联系时间',m.time)}${kv('新规则',m.rules)}<div class="note">患者名单不变，调整后记录新增版本。</div><div class="grid2">${B('返回修改','adjustTask',m.id,'btn')}${B('确认更新','confirmAdjustment',m.id,'btn primary')}</div>`);
if(m.type==='media'){const [kind,id]=m.id.split('|'),v=visit(id);return sheet(kind+' · 示意资料',`<div style="height:220px;display:grid;place-items:center;background:#f1f2e9;border-radius:18px">${mediaIcon(kind).replace('<svg ','<svg style="width:90%;height:180px" ')}</div>${badge('示意图 · 非真实患者影像','gray')}${kv('资料来源',v.date+' · 本次就诊')}${kv('AI提取',kind.includes('舌')?v.tongue:kind==='面容'?'面容图像为占位示意，不作诊断推断。':'未接入真实检查报告，不虚构检验值。')}<div class="note">原始资料与识别结果分开；识别内容等待医生核实。</div>`);}
if(m.type==='sourceVisit'){const v=visit(m.id);return sheet('症状归纳的原始依据',`${kv('日期',v.date)}${kv('来源','本次病历／患者自述')}${kv('原文',v.complaint)}${v.symptoms.map(s=>kv(s.name,s.quote)).join('')}<small>症状变化记录仅比较同一症状，缺少基线时显示未评估。</small>`);}
if(m.type==='sources')return sheet('来源与审核状态','<div class="note warn">当前为产品交互演示，示例回答尚未绑定可核验的教材、指南原文或页码。</div><p>正式产品每条引用需显示资料名称、版本、具体位置及引用片段。无法核实的来源不显示为已验证证据。</p><p>本案例只演示辨证假设、证据核对和连续追问，不作真实诊断、用药或剂量建议。</p>');
if(m.type==='caseOriginal'){const r=review(m.id);return sheet('我的病例 · 原始记录',`<p>${person(r.patientId).name} · ${r.disease}</p>${r.visitIds.map(id=>{const v=visit(id);return B(`<span class="grow"><h3>${v.date}</h3><p>${v.complaint}</p></span><span class="arrow">›</span>`,'visit',id,'list-row');}).join('')}`);}
if(m.type==='referenceOriginal'){const r=review(m.id);return sheet('参考病例与来源',r.reference==='none'?'<p>本次未选择外部对照，报告只分析个人病程。</p>':`<div class="note warn">虚构教学对照，非真实专家医案。用来演示对比阅读方式，不用于直接指导治疗。</div>${kv('教学主题',r.disease+' · 辨证过程复盘')}${kv('患者信息','匿名教学患者；年龄、性别不作为匹配结论')}${kv('主诉与现病史','以同类主诉为例，要求补齐发病经过、诱因、兼症与阶段变化。')}${kv('既往／过敏／家族史','未提供，不推断为无。')}${kv('四诊摘要','通过原始资料分别核实舌象与脉象。')}${kv('治疗思路','围绕主证、病机假设、治疗目标和调整理由组织比较。')}${kv('适用边界','仅演示分析结构；未接入授权案例，不作专家疗效或相似度声明。')}`);}
if(m.type==='thinkingVersions'){const n=S.notes[m.id];return sheet('医生思路 · 历史版本',n?.versions?.length?n.versions.slice().reverse().map(v=>`<details><summary>v${v.version} · ${v.time}</summary><div>${v.fields.map((x,i)=>`<h3>${THINK_LABELS[i]}</h3><p class="text-body">${esc(x)}</p>`).join('')}${v.free?`<p class="text-body">${esc(v.free)}</p>`:''}</div></details>`).join(''):'<div class="empty">尚未确认保存，当前仅有AI草稿。</div>');}
if(m.type==='reanalyse')return sheet('临床思维已保存',`<p>您的思路已作为医生确认版本保存。要基于这次补充更新AI对比吗？</p><div class="note">只新增分析版本，不覆盖医生文字与原始病历。</div><div class="grid2">${B('暂不更新','close','','btn')}${B('更新对比分析','reanalyzeConfirm',m.id,'btn primary')}</div>`);
